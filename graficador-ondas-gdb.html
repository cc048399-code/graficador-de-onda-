<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graficador de ondas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--grid:#e6e9ee;--axis:#9aa3af;--btn:#eef1f5;--acc:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1c2027;--tx:#e8ebf0;--mut:#9aa3af;--bd:#2f3640;--grid:#2a3039;--axis:#6b7480;--btn:#272d36;--acc:#5b8def}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1c2027;--tx:#e8ebf0;--mut:#9aa3af;--bd:#2f3640;--grid:#2a3039;--axis:#6b7480;--btn:#272d36;--acc:#5b8def}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
canvas{width:100%;height:320px;min-height:240px;display:block;border-radius:8px;touch-action:none;cursor:grab}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cmp{display:none;gap:6px;align-items:center;font-size:.88rem;margin-left:auto}
.cmp input{width:20px;height:20px}
.zoom{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.zoom .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.zoom b{font-size:.85rem;color:var(--mut);margin-right:2px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--btn);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--acc)}
.info{color:var(--mut);font-size:.82rem;margin-top:8px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select,input[type=number]{background:var(--btn);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.name{grid-column:1/3;display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%}
label.f{font-size:.78rem;color:var(--mut);display:block;margin-bottom:2px}
.play{grid-column:1/3}
.play.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.show{margin-left:auto;font-weight:400;font-size:.88rem;display:flex;gap:6px;align-items:center}
.show input{width:20px;height:20px;min-height:0}
@media(min-width:720px){.row{grid-template-columns:200px 1fr 1fr 150px;align-items:end}.name,.play{grid-column:auto}.show{margin-left:8px}}
</style>
</head>
<body>
<main>
<h1>Graficador de ondas</h1>
<p class="sub">Cambia la frecuencia y la amplitud, elige cuántos términos de Fourier usar y pulsa Reproducir para escucharla.</p>

<div class="card">
<div class="tabs">
<button id="tab-approx" class="on">Con términos de Fourier</button>
<button id="tab-ideal">Comparación con la aproximación</button>
</div>
<canvas id="cv"></canvas>
<div class="zoom">
<div class="grp"><b>Zoom X</b><button data-a="xin" title="Acercar en X">＋</button><button data-a="xout" title="Alejar en X">－</button></div>
<div class="grp"><b>Zoom Y</b><button data-a="yin" title="Acercar en Y">＋</button><button data-a="yout" title="Alejar en Y">－</button></div>
<div class="grp"><b>Mover</b><button data-a="left">◀</button><button data-a="right">▶</button></div>
<button data-a="reset">Restablecer</button>
</div>
<div class="info" id="info"></div>
</div>

<div class="card">
<div class="top">
<div style="min-width:200px;flex:1;max-width:320px">
<label class="f" for="terms">Términos de la serie de Fourier (1 a 20)</label>
<select id="terms"></select>
</div>
<div class="info" style="flex:2;min-width:220px;margin:0">Más términos = onda más cercana a la ideal. La onda armónica es una senoidal pura y no usa términos.</div>
</div>
<div id="rows"></div>
</div>
</main>

<script>
const W=[
{n:"Armónica (seno)",c:"#2563eb"},
{n:"Cuadrada",c:"#dc2626"},
{n:"Triangular",c:"#16a34a"},
{n:"Diente de sierra",c:"#d97706"}];
W.forEach(w=>{w.f=200;w.a=1;w.show=true;w.node=null});
let N=10,x0=0,xspan=0.02,yzoom=1;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);

// UI
const sel=$("terms");
for(let i=1;i<=20;i++){const o=document.createElement("option");o.value=i;o.textContent=i+(i===1?" término":" términos");if(i===N)o.selected=true;sel.appendChild(o)}
sel.onchange=()=>{N=+sel.value;restartAll();draw()};
const rows=$("rows");
W.forEach((w,i)=>{
const d=document.createElement("div");d.className="row";
d.innerHTML=`<div class="name"><span class="dot" style="background:${w.c}"></span>${w.n}
<label class="show"><input type="checkbox" checked data-i="${i}" data-k="show">Ver</label></div>
<div><label class="f">Frecuencia (Hz)</label><input type="number" min="1" max="5000" step="1" value="${w.f}" data-i="${i}" data-k="f" inputmode="decimal"></div>
<div><label class="f">Amplitud</label><input type="number" min="0" max="10" step="0.1" value="${w.a}" data-i="${i}" data-k="a" inputmode="decimal"></div>
<button class="play" id="p${i}">▶ Reproducir</button>`;
rows.appendChild(d);
d.querySelector(".play").onclick=()=>toggle(i);
});
rows.addEventListener("input",e=>{
const t=e.target,i=t.dataset.i;if(i===undefined)return;
const w=W[i];
if(t.dataset.k==="show")w.show=t.checked;
else{let v=parseFloat(t.value);if(!isFinite(v))return;
if(t.dataset.k==="f")v=Math.min(5000,Math.max(1,v));else v=Math.min(10,Math.max(0,v));
w[t.dataset.k]=v;if(w.node)restart(+i)}
draw();
});

// Ondas (serie de Fourier truncada)
function val(i,t){
const w=W[i],p=2*Math.PI*w.f*t;let s=0;
if(i===0)return w.a*Math.sin(p);
for(let n=1;n<=N;n++){
if(i===1){if(n%2)s+=4/(Math.PI*n)*Math.sin(n*p)}
else if(i===2){if(n%2)s+=8/(Math.PI*Math.PI*n*n)*(((n-1)/2)%2?-1:1)*Math.sin(n*p)}
else s+=2/(Math.PI*n)*(n%2?1:-1)*Math.sin(n*p);
}
return w.a*s;
}

// Onda ideal (matemática exacta, con infinitos términos)
function ideal(i,t){
const w=W[i],u=((w.f*t)%1+1)%1;
if(i===0)return w.a*Math.sin(2*Math.PI*u);
if(i===1)return w.a*(u<.5?1:-1);
if(i===2)return w.a*(u<.25?4*u:u<.75?2-4*u:4*u-4);
return w.a*(u<.5?2*u:2*u-2);
}
let mode="approx";
function setMode(m){
mode=m;
$("tab-approx").classList.toggle("on",m==="approx");
$("tab-ideal").classList.toggle("on",m==="ideal");
draw();
}
$("tab-approx").onclick=()=>setMode("approx");
$("tab-ideal").onclick=()=>setMode("ideal");

// Dibujo
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function nice(r){const e=Math.pow(10,Math.floor(Math.log10(r))),m=r/e;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*e}
function fmt(v,u){const a=Math.abs(v);if(u==="t"){return a>=1?v.toFixed(2)+" s":(v*1000).toFixed(a<0.001?2:1)+" ms"}return(+v.toFixed(3)).toString()}
function draw(){
const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
ctx.setTransform(dpr,0,0,dpr,0,0);
const w=r.width,h=r.height,ml=44,mb=22,pw=w-ml-6,ph=h-mb-8;
ctx.clearRect(0,0,w,h);
const vis=W.filter(q=>q.show);
const amax=Math.max(1,...vis.map(q=>q.a*(q===W[0]?1:1.1)));
const ym=amax*1.15/yzoom;
const X=t=>ml+(t-x0)/xspan*pw,Y=v=>8+ph/2-v/ym*ph/2;
ctx.font="11px system-ui,sans-serif";ctx.textBaseline="middle";
ctx.save();ctx.beginPath();ctx.rect(ml,8,pw,ph);ctx.clip();
ctx.strokeStyle=css("--grid");ctx.lineWidth=1;
const sx=nice(xspan/6);
for(let t=Math.ceil(x0/sx)*sx;t<x0+xspan;t+=sx){ctx.beginPath();ctx.moveTo(X(t),8);ctx.lineTo(X(t),8+ph);ctx.stroke()}
const sy=nice(ym/2.5);
for(let v=-Math.floor(ym/sy)*sy;v<=ym;v+=sy){ctx.beginPath();ctx.moveTo(ml,Y(v));ctx.lineTo(ml+pw,Y(v));ctx.stroke()}
ctx.strokeStyle=css("--axis");ctx.beginPath();ctx.moveTo(ml,Y(0));ctx.lineTo(ml+pw,Y(0));ctx.stroke();
ctx.lineWidth=2;ctx.lineJoin="round";
W.forEach((q,i)=>{if(!q.show)return;
const steps=Math.ceil(pw);
const trace=(fn,dash,alpha)=>{
ctx.strokeStyle=q.c;ctx.globalAlpha=alpha;ctx.setLineDash(dash);ctx.beginPath();
for(let k=0;k<=steps;k++){const t=x0+k/steps*xspan,y=Y(fn(i,t));k?ctx.lineTo(X(t),y):ctx.moveTo(X(t),y)}
ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1};
if(mode==="ideal"){
trace(val,[6,5],.7);
trace(ideal,[],1);
}else trace(val,[],1);
});
ctx.restore();
ctx.fillStyle=css("--mut");ctx.textAlign="center";
for(let t=Math.ceil(x0/sx)*sx;t<x0+xspan;t+=sx)ctx.fillText(fmt(t,"t"),X(t),h-9);
ctx.textAlign="right";
for(let v=-Math.floor(ym/sy)*sy;v<=ym;v+=sy)ctx.fillText(fmt(v),ml-5,Y(v));
$("info").textContent=(mode==="ideal"?`Línea continua: onda ideal. Punteada: aproximación con ${N} términos. `:`Aproximación con ${N} términos. `)+`Ventana: ${fmt(xspan,"t")} · Eje Y: ±${fmt(ym)} · Arrastra la gráfica para moverla.`;
}

// Zoom y movimiento
const acts={xin:()=>{x0+=xspan*.25;xspan/=2},xout:()=>{x0-=xspan*.5;xspan*=2},
yin:()=>{yzoom=Math.min(yzoom*1.5,50)},yout:()=>{yzoom=Math.max(yzoom/1.5,.1)},
left:()=>{x0-=xspan*.25},right:()=>{x0+=xspan*.25},
reset:()=>{x0=0;xspan=.02;yzoom=1}};
document.querySelectorAll(".zoom button").forEach(b=>b.onclick=()=>{acts[b.dataset.a]();xspan=Math.min(Math.max(xspan,1e-5),20);draw()});
let drag=null;
cv.onpointerdown=e=>{drag={x:e.clientX,x0};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"};
cv.onpointermove=e=>{if(!drag)return;const pw=cv.getBoundingClientRect().width-50;x0=drag.x0-(e.clientX-drag.x)/pw*xspan;draw()};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor="grab"};
try{new ResizeObserver(draw).observe(cv)}catch(e){}
window.addEventListener("resize",draw);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw)}catch(e){}

// Audio
let ac=null;
function toggle(i){
try{
if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
if(ac.state==="suspended")ac.resume();
W[i].node?stop(i):start(i);
}catch(e){alert("Este navegador o editor no permite audio: "+e.message)}
}
function start(i){
const w=W[i],imag=new Float32Array(N+1),real=new Float32Array(N+1);
for(let n=1;n<=(i===0?1:N);n++){
imag[n]=i===0?1:i===1?(n%2?4/(Math.PI*n):0):i===2?(n%2?8/(Math.PI*Math.PI*n*n)*(((n-1)/2)%2?-1:1):0):2/(Math.PI*n)*(n%2?1:-1);
}
const osc=ac.createOscillator(),g=ac.createGain();
osc.setPeriodicWave(ac.createPeriodicWave(real,imag,{disableNormalization:true}));
osc.frequency.value=w.f;
g.gain.value=0.2*Math.min(w.a,1);
osc.connect(g).connect(ac.destination);osc.start();
w.node={osc,g};
const b=$("p"+i);b.classList.add("on");b.textContent="■ Detener";
}
function stop(i){
const w=W[i];if(!w.node)return;
try{w.node.osc.stop();w.node.osc.disconnect();w.node.g.disconnect()}catch(e){}
w.node=null;const b=$("p"+i);b.classList.remove("on");b.textContent="▶ Reproducir";
}
function restart(i){stop(i);start(i)}
function restartAll(){W.forEach((w,i)=>{if(w.node)restart(i)})}
draw();
</script>
</body>
</html>
